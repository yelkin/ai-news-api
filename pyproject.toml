[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-news-api"
version = "0.1.0"
description = "AI news API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyter-ai>=3.1.3",
    "openai>=3.3.1",
    "pgvector>=0.5.0",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "sqlmodel>=0.0.42",
    "tiktoken>=0.14.0",
    "uvicorn>=0.52.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
]

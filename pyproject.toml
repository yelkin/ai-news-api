[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-news-api"
version = "0.1.0"
description = "AI news API"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyter-ai>=3.1.3",
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
ainews = "app.main:main"
[tool.hatch.build.targets.wheel]
packages = ["app"]

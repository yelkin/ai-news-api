services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ainews
      POSTGRES_USER: ainews
      POSTGRES_PASSWORD: ainews
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainews -d ainews"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ainews_test
      POSTGRES_USER: ainews
      POSTGRES_PASSWORD: ainews
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainews -d ainews_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
